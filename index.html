<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #efe4cb;
      --ink: #006A4E;
      --red: #F42A41;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans Bengali", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .banner {
      width: 100%;
      max-width: 600px;
      height: auto;
      display: block;
    }
    main {
      width: 100%;
      max-width: 640px;
      padding: 2.5rem 1.25rem 3rem;
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .rule {
      width: 400px;
      height: 4px;
      margin: 1rem auto 1.5rem;
      background: var(--red);
      border: 0;
    }
    p {
      margin: 0 0 1rem;
      line-height: 1.7;
      font-size: 1.05rem;
    }
    .note {
      margin-top: 2rem;
      font-size: 0.9rem;
      opacity: 0.75;
    }

    /* entrance animations */
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes rise-note { from { opacity: 0; transform: translateY(14px); } to { opacity: 0.75; transform: none; } }
    .banner { animation: rise 0.9s ease-out both; }
    h1 { animation: rise 0.8s ease-out 0.4s both; }
    .rule { animation: grow 0.8s ease-out 0.9s both; transform-origin: center; }
    main p { animation: rise 0.8s ease-out 1.3s both; }
    .note { animation: rise-note 0.8s ease-out 1.6s both; }
    .loader { animation: rise 0.8s ease-out 1.1s both; }

    /* loader (inline, flag palette) */
    .loader {
      position: relative;
      width: 100px;
      height: 60px;
      margin: 0 auto 4rem; /* arcs swing below the box while spinning */
    }
    .loader-inner {
      bottom: 0;
      height: 60px;
      left: 0;
      margin: auto;
      position: absolute;
      right: 0;
      top: 0;
      width: 100px;
    }
    .loader-line-wrap {
      animation: spin 2000ms cubic-bezier(.175, .885, .32, 1.275) infinite;
      box-sizing: border-box;
      height: 50px;
      left: 0;
      overflow: hidden;
      position: absolute;
      top: 0;
      transform-origin: 50% 100%;
      width: 100px;
    }
    .loader-line {
      border: 4px solid transparent;
      border-radius: 100%;
      box-sizing: border-box;
      height: 100px;
      left: 0;
      margin: 0 auto;
      position: absolute;
      right: 0;
      top: 0;
      width: 100px;
    }
    .loader-line-wrap:nth-child(1) { animation-delay: -50ms; }
    .loader-line-wrap:nth-child(2) { animation-delay: -100ms; }
    .loader-line-wrap:nth-child(3) { animation-delay: -150ms; }
    .loader-line-wrap:nth-child(4) { animation-delay: -200ms; }
    .loader-line-wrap:nth-child(5) { animation-delay: -250ms; }

    .loader-line-wrap:nth-child(1) .loader-line { border-color: #F42A41; height: 90px; width: 90px; top: 7px; }
    .loader-line-wrap:nth-child(2) .loader-line { border-color: #B71C2E; height: 76px; width: 76px; top: 14px; }
    .loader-line-wrap:nth-child(3) .loader-line { border-color: #004D38; height: 62px; width: 62px; top: 21px; }
    .loader-line-wrap:nth-child(4) .loader-line { border-color: #006A4E; height: 48px; width: 48px; top: 28px; }
    .loader-line-wrap:nth-child(5) .loader-line { border-color: #2E9B7A; height: 34px; width: 34px; top: 35px; }

    @keyframes spin {
      0%, 15% { transform: rotate(0); }
      100% { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <img class="banner" src="images/corjapod.webp" alt="Illustration inspired by the Charyapada, the earliest known Bangla writing">
  <main>
    <h1>Project Coming Soon</h1>
    <hr class="rule">
    <div class="loader">
      <div class="loader-inner">
        <div class="loader-line-wrap"><div class="loader-line"></div></div>
        <div class="loader-line-wrap"><div class="loader-line"></div></div>
        <div class="loader-line-wrap"><div class="loader-line"></div></div>
        <div class="loader-line-wrap"><div class="loader-line"></div></div>
        <div class="loader-line-wrap"><div class="loader-line"></div></div>
      </div>
    </div>
    <p>We are building a Bangla handwriting research project. Details, the data-use policy and our results will be published here.</p>
    <p class="note">Illustration taken from (ত্রিলোক বাচিক পাঠশালা), it is the earliest known Bangla writing.</p>
  </main>
</body>
</html>
